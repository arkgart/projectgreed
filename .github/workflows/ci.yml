name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  cpu-tests:
    name: cpu tests / py${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - run: pytest tests/test_reference.py -ra -q
      - run: python bench/cpu_bench.py --n-options 1024 --repeats 3

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: |
          python -m pip install --upgrade pip
          pip install ruff
          ruff check src/ tests/ bench/

  build:
    name: build sdist + wheel
    runs-on: ubuntu-latest
    needs: [cpu-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: |
          python -m pip install --upgrade pip build
          python -m build --sdist --wheel --outdir dist/
      - uses: actions/upload-artifact@v4
        with: { name: dist, path: dist/* }

  # GPU + Modal launch is gated behind a manual workflow_dispatch because
  # it costs real money (~$15-25 per run on 8x A100).
  bench-a100:
    name: 8x A100 benchmark on Modal
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: modal-bench
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: |
          pip install modal
          pip install -e ".[modal]"
      - run: modal token set --token-id ${{ secrets.MODAL_TOKEN_ID }} --token-secret ${{ secrets.MODAL_TOKEN_SECRET }}
      - run: modal run -m fastgreeks.launch.bench_a100 --n-options 67108864 --sweep
      - uses: actions/upload-artifact@v4
        with: { name: bench-csv, path: bench/results/*.csv }
